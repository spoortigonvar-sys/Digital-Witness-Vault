<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Emergency Evidence Vault</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        🛡️ AI Emergency Evidence Vault
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>

</header>

<section class="auth-section">

    <div class="auth-card">

        <h2>Login</h2>

        <p>Login to access your secure evidence vault.</p>

        <form id="login-form">

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="auth-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

    </div>

</section>

<script src="js/login.js"></script>

</body>
</html>
