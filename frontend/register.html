<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Emergency Evidence Vault</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <div class="logo">
        🛡️ AI Emergency Evidence Vault
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>

</header>

<section class="auth-section">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p>Create your secure evidence vault account.</p>

        <form id="register-form">

            <input
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p class="auth-link">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </div>

</section>

</body>
</html>
